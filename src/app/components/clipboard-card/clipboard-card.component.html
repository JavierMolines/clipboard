<div
  id="{{ prefix + id }}"
  (click)="loadClipboard(data)"
  style="scrollbar-width: none"
  [class]="styles.container"
>
  @if (isListView) {
    <div [class]="styles.listRow">
      <div [class]="styles.listHeader">
        <span class="shrink-0 whitespace-nowrap text-xs text-gray-700">{{
          time
        }}</span>

        @if (title !== "") {
          <span [class]="styles.listSeparator">-</span>
          <h2 [class]="styles.listTitle">
            {{ title }}
          </h2>
        }

        <span [class]="styles.listSeparator">-</span>
      </div>

      <p [class]="styles.listContent">
        {{ data }}
      </p>
    </div>
  } @else {
    @if (title !== "") {
      <h2 [class]="styles.title">{{ title }}</h2>
    }

    <span [class]="styles.time">{{ time }}</span>
    <p [class]="styles.content">{{ data }}</p>
  }

  <button
    type="button"
    [class]="styles.deleteButton"
    aria-label="Delete card"
    (click)="$event.stopPropagation()"
  >
    <span class="group-focus:hidden">
      <app-icons name="delete" color="#580f0f" />
    </span>

    <span class="hidden group-focus:block" (click)="deleteItem($event, id)">
      <app-icons name="confirm-delete" color="#580f0f" />
    </span>
  </button>

  @if (urlContent !== "") {
    <a
      onclick="event.stopPropagation()"
      [href]="urlContent"
      target="_blank"
      [class]="styles.externalLinkButton"
      aria-label="Open Url Card"
    >
      <app-icons name="external-link" color="#580f0f" />
    </a>
  }
</div>
