<form class="flex flex-col gap-4 h-full">
  <h3 class="text-2xl">Paste your clipboard</h3>

  <article class="flex flex-col gap-2 w-full md:w-1/2">
    <div
      class="w-full py-6 px-6 bg-gray-50 rounded-2xl border border-gray-300 gap-4 grid border-dashed"
    >
      <div class="flex flex-col sm:flex-row gap-3">
        <textarea
          [id]="idTextInput"
          rows="4"
          class="w-full p-2.5 text-md rounded-lg border border-gray-300 text-gray-950 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-600"
          placeholder="Data here..."
          [formControl]="textArea"
        ></textarea>
      </div>

      <h3 class="text-xl">
        Add a title
        <span class="text-sm text-gray-700">(Optional)</span>
      </h3>

      <input
        class="w-full p-2.5 text-md rounded-lg border text-gray-950 bg-gray-50 border-gray-300 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-600"
        type="text"
        placeholder="Title here..."
        [formControl]="titleInput"
      />

      <div class="flex gap-2">
        <button
          aria-label="Save clipboard"
          (click)="buttonClick($event)"
          type="submit"
          class="w-full lg:w-auto focus:outline-none text-white bg-green-700 hover:bg-green-800 focus:ring-2 focus:ring-green-300 font-medium rounded-lg text-md px-5 py-2.5 mb-2 cursor-pointer"
        >
          Save
        </button>
        <button
          aria-label="Clear form"
          (click)="clearForm()"
          type="button"
          class="w-full lg:w-auto focus:outline-none text-white bg-gray-700 hover:bg-gray-800 focus:ring-2 focus:ring-gray-300 font-medium rounded-lg text-md px-5 py-2.5 mb-2 cursor-pointer"
        >
          Clear
        </button>
      </div>
    </div>
  </article>
</form>
