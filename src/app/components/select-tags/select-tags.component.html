<div class="relative w-full">
  <select
    class="w-full appearance-none p-2.5 pr-10 text-md rounded-lg border text-gray-950 bg-gray-50 border-gray-300 focus:outline-none focus:ring-2 focus:ring-orange-600"
    [value]="inputSelectTag()"
    (change)="handlerChangeSelect($event)"
    [disabled]="tags().length === 0"
  >
    @if (tags().length === 0) {
      <option value="" selected>No tags</option>
    } @else {
      <option value="" selected>Select tag</option>
      @for (tag of tags(); track tag.color) {
        <option value="{{ tag.name }}">{{ tag.name }}</option>
      }
    }
  </select>

  <svg
    class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-600"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="M19 9l-7 7-7-7"
    />
  </svg>
</div>
