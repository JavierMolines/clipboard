<section class="flex flex-col h-full min-h-0 gap-5">
  <article class="flex flex-col gap-2 w-full md:w-1/2">
    <h1 class="text-2xl">Manage tags</h1>
    <div
      class="w-full py-6 px-6 bg-gray-50 rounded-2xl border border-gray-300 gap-4 grid border-dashed"
    >
      <p class="text-sm text-gray-700">
        Create tags to keep your clipboard items organized.
      </p>

      <div class="flex flex-col sm:flex-row gap-3">
        <input
          type="text"
          [id]="idTextInput"
          [value]="tagInputValue()"
          (input)="handlerInputTag($event)"
          (keyup.enter)="handlerAddTag()"
          placeholder="Write a new tag (min 4 characters)"
          class="w-full px-4 py-2 rounded-lg border border-gray-300 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-orange-600"
        />

        <button
          type="button"
          aria-label="Add tag"
          (click)="handlerAddTag()"
          [class]="
            isValidTagInput()
              ? 'w-auto whitespace-nowrap focus:outline-none text-white bg-green-700 hover:bg-green-800 focus:ring-2 focus:ring-green-300 font-medium rounded-lg text-md px-5 py-2.5 cursor-pointer'
              : 'w-auto whitespace-nowrap focus:outline-none text-white bg-gray-700 hover:bg-gray-600 focus:ring-2 focus:ring-gray-300 font-medium rounded-lg text-md px-5 py-2.5 cursor-pointer'
          "
        >
          Add
        </button>
      </div>
    </div>
  </article>

  <article class="flex flex-col gap-2 flex-1 min-h-0">
    <h1 class="text-2xl">Created tags</h1>
    <div
      class="w-full py-6 px-6 bg-gray-50 rounded-2xl border border-gray-300 border-dashed h-full min-h-0 flex flex-col"
    >
      @if (tags().length === 0) {
        <p class="text-sm text-gray-700">No tags created yet.</p>
      } @else {
        <app-list-tags [(tags)]="tags"></app-list-tags>
      }
    </div>
  </article>
</section>
